<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library | Phan Hoàng Lan</title>
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="stylesheet" href="css/games.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="steam-page-body">

    <header
        style="background-color: #14532d; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;">
        <a href="home.html" style="color: #fff; font-weight: 800; font-size: 24px; text-decoration: none;">
            BEAR<span style="color: #22c55e;">.</span>
        </a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="home.html" style="color: #22c55e; text-decoration: none; font-weight: bold;">
                <i class="fas fa-arrow-left"></i> <span class="lang" data-vi="Quay lại" data-en="Back">Quay lại</span>
            </a>
            <button id="lang-btn"
                style="padding: 5px 15px; border-radius: 20px; border: 1px solid #fff; background: transparent; color: #fff; cursor: pointer; font-weight: bold;">EN</button>
        </div>
    </header>
    <section>
        <!-- KHUNG STEAM LIBRARY (CHIA 2 CỘT TRÁI - PHẢI) -->
        <div class="steam-container">

            <!-- CỘT TRÁI: DANH SÁCH GAME (CÓ THANH SCROLL & TÌM KIẾM) -->
            <aside class="steam-sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-gamepad"></i>
                    <span class="lang" data-vi="THƯ VIỆN GAME" data-en="GAMES LIBRARY">THƯ VIỆN GAME</span>
                </div>

                <!-- Ô tìm kiếm nhanh giống Steam -->
                <div class="sidebar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="game-search-input" placeholder="Search games...">
                </div>

                <!-- Danh sách game có nút Scroll (Sẽ được JS tự động đổ vào đây) -->
                <ul class="steam-game-list" id="steam-game-list"></ul>
            </aside>

            <!-- CỘT PHẢI: CHI TIẾT GAME & SLIDER ẢNH -->
            <main class="steam-main-content">

                <!-- 1. Khung Slider Hình ảnh (Có mũi tên qua lại) -->
                <div class="game-gallery-slider">
                    <button class="slider-btn prev-btn" id="prev-img-btn"><i class="fas fa-chevron-left"></i></button>
                    <img id="game-slider-img" src="" alt="Game Screenshot">
                    <button class="slider-btn next-btn" id="next-img-btn"><i class="fas fa-chevron-right"></i></button>

                    <!-- Chấm tròn báo vị trí ảnh -->
                    <div class="slider-dots" id="slider-dots"></div>
                </div>

                <!-- 2.Thời gian chơi, Thể loại, Vai trò...-->
                <div class="steam-stats-bar">
                    <div class="steam-play-badge">
                        <i class="fas fa-check-circle"></i>
                        <span class="lang" data-vi="ĐÃ TRẢI NGHIỆM" data-en="EXPERIENCED">ĐÃ TRẢI NGHIỆM</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label lang" data-vi="THỜI GIAN CHƠI" data-en="PLAYING TIME">THỜI GIAN CHƠI</span>
                        <span class="stat-value" id="game-since">Since 2023</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label lang" data-vi="THỂ LOẠI" data-en="GENRE">THỂ LOẠI</span>
                        <span class="stat-value" id="game-genre">Action / Co-op</span>
                    </div>

                    <div class="stat-box">
                        <span class="stat-label lang" data-vi="ĐIỂM NHẤN / CLAN" data-en="HIGHLIGHT / CLAN">ĐIỂM NHẤN /
                            CLAN</span>
                        <span class="stat-value" id="game-highlight">Team Player</span>
                    </div>
                </div>

                <!-- 3. Tên Game & Cảm nhận chi tiết -->
                <div class="steam-review-section">
                    <h1 id="game-title">Tên Game</h1>

                    <div class="review-card">
                        <div class="review-header">
                            <i class="fas fa-quote-left"></i>
                            <span class="lang" data-vi="GÓC NHÌN & TRẢI NGHIỆM CÁ NHÂN"
                                data-en="PERSONAL EXPERIENCE & GAME DESIGN NOTES">GÓC NHÌN & TRẢI NGHIỆM CÁ NHÂN</span>
                        </div>
                        <div id="game-review-text" class="review-body">
                            <!-- review data -->
                        </div>
                    </div>
                </div>

            </main>
        </div>

    </body>section>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
        <script src="js/script.js"></script> 
        <script src="js/games.js"></script> 
</body>

</html>
